llm:
  api_key: "sk-your-deepseek-api-key"
  # openai: OpenAI 兼容格式（默认）
  # anthropic: Anthropic 原生协议，base_url 填 SDK 风格根地址（如 https://opencode.ai/zen/go，自动补 /v1/messages）
  protocol: openai
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  # Voice-oriented replies should be concise and varied without becoming
  # unpredictable. Conversation summaries use a separate low temperature.
  temperature: 0.8
  max_tokens: 400
  frequency_penalty: 0.15

tts:
  base_url: "http://127.0.0.1:9880"
  # Use an absolute path because api_v2.py runs from the GPT-SoVITS directory.
  # Full locked recipe (weights + train + infer): configs/huayin_precision.yaml
  # 由 scripts/setup_runtime_env.sh 自动改写为本机绝对路径
  ref_audio_path: "/path/to/tts/model/huayin-ref.wav"
  ref_text: "所以和朋友一起吃饭的话比较好哦"
  ref_language: "zh"
  # Aligned with configs/huayin_precision.yaml inference (user-approved 2026-08-14).
  text_language: "auto"
  top_k: 15
  top_p: 1.0
  temperature: 1.0
  repetition_penalty: 1.35
  speed_factor: 1.0
  seed: 42
  text_split_method: "cut5"

asr:
  model: "small"
  device: "auto"
  compute_type: "auto"
  language: "auto"
  beam_size: 5
  max_upload_mb: 15

conversation:
  # Keep recent turns verbatim and compact older complete turns into memory.
  recent_turns: 8
  summary_trigger_turns: 12
  summary_trigger_chars: 12000
  summary_max_chars: 1800

streaming:
  min_sentence_chars: 4
  max_sentence_chars: 50

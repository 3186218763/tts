llm:
  api_key: "sk-your-deepseek-api-key"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

tts:
  base_url: "http://127.0.0.1:9880"
  # Use an absolute path because api_v2.py runs from the GPT-SoVITS directory.
  ref_audio_path: "/home/mtr/tt/tts/model/huayin_ref.wav"
  ref_text: "所以和朋友一起吃饭的话比较好哦"
  ref_language: "zh"
  # Conservative, reproducible inference defaults. Tune these only after
  # comparing the same text with a fixed seed.
  text_language: "auto"
  top_k: 15
  top_p: 1.0
  temperature: 0.85
  repetition_penalty: 1.35
  speed_factor: 1.0
  seed: 42

asr:
  model: "small"
  device: "auto"
  compute_type: "auto"
  language: "auto"
  beam_size: 5
  max_upload_mb: 15

conversation:
  max_turns: 10

streaming:
  max_sentence_chars: 25

[project]
name = "ai-huayin-tts"
version = "0.1.0"
description = "AI 真白花音 TTS 交互对话系统"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "httpx>=0.27",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "opencc-python-reimplemented>=2.1",
    "librosa>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dialogue*", "frontend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
